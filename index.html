<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050506">
  <title>Self Made Traders — Founding spots sold out</title>
  <meta name="description" content="Self Made Traders by 100XClub. Founding spots are sold out. Be the first to know when spots open.">
  <meta property="og:title" content="Self Made Traders — Founding spots sold out">
  <meta property="og:description" content="Be the first to know when spots open.">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050506;
      --bg-card: #0a0c0b;
      --green: #1f9468;
      --green-deep: #0e6b4a;
      --green-dim: rgba(31, 148, 104, 0.22);
      --text: #f3efe6;
      --muted: #b4b0a7;
      --line: rgba(243, 239, 230, 0.12);
      --danger: #e07070;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter Tight", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px calc(32px + env(safe-area-inset-bottom));
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(14, 107, 74, 0.28), transparent 60%),
        var(--bg);
    }

    main {
      width: 100%;
      max-width: 420px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-bottom: 36px;
      text-align: center;
    }

    .brand-kicker {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--green);
      font-weight: 600;
    }

    .brand-name {
      font-size: 15px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
    }

    h1 {
      font-size: clamp(36px, 11vw, 56px);
      line-height: 0.95;
      letter-spacing: -0.04em;
      font-weight: 700;
      text-align: center;
      margin-bottom: 16px;
    }

    .sub {
      text-align: center;
      font-size: 17px;
      line-height: 1.4;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 32px;
    }

    form, .thanks {
      width: 100%;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    .optional {
      color: var(--muted);
      font-weight: 500;
    }

    .field { margin-bottom: 16px; }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--bg-card);
      color: var(--text);
      font: inherit;
      font-size: 16px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input::placeholder { color: #6f6d68; }

    input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px var(--green-dim);
    }

    .hp {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    button[type="submit"] {
      width: 100%;
      height: 54px;
      margin-top: 8px;
      border: 0;
      border-radius: 12px;
      background: var(--green);
      color: var(--text);
      font: inherit;
      font-size: 16px;
      font-weight: 650;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease, opacity 0.15s ease;
    }

    button[type="submit"]:hover { background: var(--green-deep); }
    button[type="submit"]:active { transform: scale(0.99); }
    button[type="submit"]:disabled { opacity: 0.7; cursor: wait; }

    .error {
      display: none;
      margin-top: 14px;
      font-size: 13px;
      color: var(--danger);
      text-align: center;
    }

    .error.show { display: block; }

    .thanks {
      display: none;
      text-align: center;
      padding: 28px 8px 8px;
    }

    .thanks.show { display: block; }

    .thanks h2 {
      font-size: 32px;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
    }

    .thanks p {
      color: var(--muted);
      font-size: 17px;
      line-height: 1.4;
    }

    footer {
      margin-top: 40px;
      text-align: center;
      font-size: 13px;
      color: #8c8a84;
    }

    footer a {
      color: var(--muted);
      text-decoration: none;
    }

    footer a:hover { color: var(--text); }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <div class="brand-kicker">100XClub</div>
      <div class="brand-name">Self Made Traders</div>
    </div>

    <div id="page-form">
      <h1>Founding spots sold out</h1>
      <p class="sub">Be the first to know when spots open.</p>

      <form id="waitlist" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required>
        </div>
        <div class="field">
          <label for="telegram">Telegram <span class="optional">(optional)</span></label>
          <input id="telegram" name="telegram" type="text" autocomplete="off" placeholder="@username" spellcheck="false">
        </div>
        <div class="field">
          <label for="x">X <span class="optional">(optional)</span></label>
          <input id="x" name="x" type="text" autocomplete="off" placeholder="@username" spellcheck="false">
        </div>
        <div class="hp" aria-hidden="true">
          <label for="company">Company</label>
          <input id="company" name="company" type="text" tabindex="-1" autocomplete="off">
        </div>
        <button type="submit" id="submit">Notify me</button>
        <p class="error" id="error" role="alert">Something went wrong. Please try again.</p>
      </form>
    </div>

    <div class="thanks" id="thanks">
      <h2>You're on the list.</h2>
      <p>We'll let you know when spots open.</p>
    </div>

    <footer>
      100XClub · <a href="https://t.me/Fefedemeny" rel="noopener noreferrer">Telegram</a>
    </footer>
  </main>

  <script>
    const ENDPOINT = "SUBMIT_ENDPOINT_PLACEHOLDER";

    const form = document.getElementById("waitlist");
    const submit = document.getElementById("submit");
    const errorEl = document.getElementById("error");
    const thanks = document.getElementById("thanks");
    const pageForm = document.getElementById("page-form");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorEl.classList.remove("show");

      const name = form.name.value.trim();
      const email = form.email.value.trim();
      const telegram = form.telegram.value.trim();
      const x = form.x.value.trim();
      const honeypot = form.company.value.trim();

      if (!name || !email) {
        errorEl.textContent = "Name and email are required.";
        errorEl.classList.add("show");
        return;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        errorEl.textContent = "Enter a valid email.";
        errorEl.classList.add("show");
        return;
      }

      if (honeypot) {
        pageForm.style.display = "none";
        thanks.classList.add("show");
        return;
      }

      submit.disabled = true;
      submit.textContent = "Sending…";

      try {
        const response = await fetch(ENDPOINT, {
          method: "POST",
          mode: "cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ name, email, telegram, x })
        });

        let ok = response.ok;
        if (response.ok) {
          try {
            const payload = await response.json();
            if (payload && payload.ok === false) ok = false;
          } catch (e) {
            // Some endpoints return an empty body on success.
          }
        }

        if (!ok) throw new Error("Request failed");

        pageForm.style.display = "none";
        thanks.classList.add("show");
      } catch (err) {
        errorEl.textContent = "Something went wrong. Please try again.";
        errorEl.classList.add("show");
        submit.disabled = false;
        submit.textContent = "Notify me";
      }
    });
  </script>
</body>
</html>
